<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UniHelper</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%232f55d4%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27Georgia%27 font-weight=%27bold%27%3EU%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<!-- sign in / sign up -->
<section id="login" class="login" hidden></section>

<div id="app" hidden>
<header class="top">
  <div class="top-in">
    <button class="brand" data-go="start" aria-label="UniHelper home"><span class="logo">U</span><span class="bname">UniHelper</span></button>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="gq" type="search" placeholder="Search by course code or title   ( / )" autocomplete="off" aria-label="Search courses" aria-controls="gres">
      <kbd>/</kbd>
      <div id="gres" class="gres" hidden></div>
    </div>
    <div class="acts">
      <button class="pill" id="planPill" data-go="plan" title="My plan"><span class="ic">📅</span><b id="planCount">0</b><span class="hide-s"> cr</span></button>
      <button class="btn-i" id="btnOut" title="Log out"><span class="ic">👤</span><span class="hide-s" id="whoName"></span><span class="hide-s"> · Log out</span></button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-go="start"><span class="ic">🏁</span>Start</button>
    <button data-go="advisor"><span class="ic">💬</span>Advisor</button>
    <button data-go="courses"><span class="ic">📚</span>Courses</button>
    <button data-go="degree"><span class="ic">🎓</span>Degree</button>
    <button data-go="plan"><span class="ic">🗓️</span>My plan</button>
  </nav>
</header>

<main id="main">
  <section id="v-start" class="view"></section>
  <section id="v-advisor" class="view" hidden></section>
  <section id="v-courses" class="view" hidden></section>
  <section id="v-degree" class="view" hidden></section>
  <section id="v-plan" class="view" hidden></section>
</main>

<footer class="foot">UniHelper is an unofficial planning helper. It can make mistakes – always confirm your courses with your academic advisor before registering.</footer>
</div>

<div id="modal" class="modal" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div id="toast" class="toast" hidden></div>

<!-- libraries (self-hosted, work offline) -->
<script src="vendor/pdf.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/parsers.js"></script>
<script src="js/pdfreader.js"></script>
<script src="js/courses.js"></script>
<script src="js/engine.js"></script>
<script src="js/advisor.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
